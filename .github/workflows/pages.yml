name: Publish test app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from https://<user>.github.io/<repo>/
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Firebase web config is public by design; access is controlled by firestore.rules.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCpVDhsHXKU14IEV_ppYc2ltvysHV9Ulh8
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-7983619446-3b874.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-7983619446-3b874
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: studio-7983619446-3b874.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "441434718560"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:441434718560:web:409478362aa5854164de05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Tell GitHub Pages not to run Jekyll, which would hide the _next folder.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
